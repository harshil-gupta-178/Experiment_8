<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <h1>Book Management System</h1>
  
  <h2>Add New Book (POST)</h2>
  <form id="addBookForm">
    <div class="form-group">
      <label for="title">Book Title *</label>
      <input type="text" id="title" placeholder="e.g. Harry Potter" required>
    </div>

    <div class="form-group">
      <label for="author">Author *</label>
      <input type="text" id="author" placeholder="e.g. J.K. Rowling" required>
    </div>

    <div class="form-group">
      <label for="genre">Genre</label>
      <input type="text" id="genre" placeholder="e.g. Fantasy">
    </div>

    <div class="form-group">
      <label for="year">Year</label>
      <input type="number" id="year" placeholder="e.g. 1997">
    </div>

    <button type="submit">Add Book</button>
  </form>
  <div id="statusMessage" class="message"></div>

  <hr style="margin: 25px 0;">

  <h2>Book Collection (GET)</h2>
  <button type="button" onclick="fetchBooks()">Refresh List</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Year</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="booksTableBody"></tbody>
  </table>

  <script>
    let localBooks = [
      { id: 1, title: "To Kill a Mockingbird", author: "Harper Lee", genre: "Fiction", year: 1960 },
      { id: 2, title: "1984", author: "George Orwell", genre: "Dystopian", year: 1949 },
      { id: 3, title: "The Great Gatsby", author: "F. Scott Fitzgerald", genre: "Classic", year: 1925 }
    ];

    async function fetchBooks() {
      try {
        const response = await fetch('/api/books');
        if (response.ok) {
          const result = await response.json();
          renderTable(result.data);
          return;
        }
      } catch (e) {}
      renderTable(localBooks);
    }

    function renderTable(books) {
      const tableBody = document.getElementById('booksTableBody');
      tableBody.innerHTML = '';

      if (!books || books.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No books found.</td></tr>';
        return;
      }

      books.forEach(book => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${book.id}</td>
          <td>${book.title}</td>
          <td>${book.author}</td>
          <td>${book.genre || '-'}</td>
          <td>${book.year || '-'}</td>
          <td>
            <button class="delete-btn" onclick="deleteBook(${book.id})">Delete</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    document.getElementById('addBookForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const newBook = {
        title: document.getElementById('title').value.trim(),
        author: document.getElementById('author').value.trim(),
        genre: document.getElementById('genre').value.trim(),
        year: document.getElementById('year').value ? parseInt(document.getElementById('year').value) : undefined
      };

      try {
        const response = await fetch('/api/books', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newBook)
        });

        if (response.ok) {
          showMessage('Book added successfully!', 'green');
          this.reset();
          fetchBooks();
          return;
        }
      } catch (e) {}

      newBook.id = localBooks.length > 0 ? Math.max(...localBooks.map(b => b.id)) + 1 : 1;
      localBooks.push(newBook);
      showMessage('Book added successfully!', 'green');
      this.reset();
      renderTable(localBooks);
    });

    async function deleteBook(id) {
      if (!confirm(`Are you sure you want to delete book ID ${id}?`)) return;

      try {
        const response = await fetch(`/api/books/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          showMessage(`Book ID ${id} deleted!`, 'red');
          fetchBooks();
          return;
        }
      } catch (e) {}

      localBooks = localBooks.filter(b => b.id !== id);
      showMessage(`Book ID ${id} deleted!`, 'red');
      renderTable(localBooks);
    }

    function showMessage(text, color) {
      const msg = document.getElementById('statusMessage');
      msg.textContent = text;
      msg.style.color = color;
      setTimeout(() => { msg.textContent = ''; }, 3000);
    }

    fetchBooks();
  </script>

</body>
</html>
